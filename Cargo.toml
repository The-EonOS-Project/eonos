[package]
name = "eonos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eonos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = "=0.5.0"
spin = "0.9"

[features]
default = []
debug-logs = []

[profile.dev]
panic = "abort"
opt-level = 0
debug = true

[profile.release]
panic = "abort"
opt-level = 2
# Kernel whole-program LTO miscompiles the core formatter's stack argument
# pointers with this higher-half target, causing a page fault during boot logs.
# Keep optimized codegen, but leave LTO enabled only for the userland target.
lto = false
debug = false
strip = true
